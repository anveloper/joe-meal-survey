<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>급식 만족도 조사</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Malgun Gothic', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 600px;
            width: 90%;
            position: relative;
        }

        /* 초기 설정 화면 */
        .setup-screen {
            text-align: center;
        }

        .setup-screen h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group input {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            border: 2px solid #ddd;
            border-radius: 10px;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn-start {
            width: 100%;
            padding: 18px;
            font-size: 20px;
            font-weight: bold;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .btn-start:hover {
            transform: translateY(-2px);
        }

        .btn-start:active {
            transform: translateY(0);
        }

        /* 투표 화면 */
        .vote-screen {
            display: none;
            text-align: center;
        }

        .vote-screen h2 {
            color: #333;
            margin-bottom: 50px;
            font-size: 32px;
            line-height: 1.5;
        }

        .menu-name {
            color: #667eea;
            font-weight: bold;
        }

        .vote-buttons {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }

        .vote-btn {
            flex: 1;
            padding: 60px 30px;
            font-size: 36px;
            font-weight: bold;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .vote-btn.yes {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
        }

        .vote-btn.no {
            background: linear-gradient(135deg, #eb3349 0%, #f45c43 100%);
            color: white;
        }

        .vote-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        .vote-btn:active {
            transform: translateY(-2px);
        }

        .thank-you {
            display: none;
            font-size: 24px;
            color: #667eea;
            font-weight: bold;
            animation: fadeIn 0.5s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        /* 결과보기 버튼 */
        .results-icon {
            position: absolute;
            bottom: 15px;
            right: 15px;
            width: 40px;
            height: 40px;
            background: rgba(102, 126, 234, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            opacity: 0.6;
        }

        .results-icon:hover {
            opacity: 1;
            transform: scale(1.1);
            background: rgba(102, 126, 234, 0.4);
        }

        .results-icon svg {
            width: 20px;
            height: 20px;
            fill: #667eea;
        }

        /* 결과 화면 */
        .results-screen {
            display: none;
        }

        .results-screen h2 {
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
            text-align: center;
        }

        .result-bars {
            margin: 30px 0;
        }

        .result-item {
            margin-bottom: 25px;
        }

        .result-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 18px;
            font-weight: bold;
        }

        .result-label.yes { color: #11998e; }
        .result-label.no { color: #eb3349; }

        .result-bar {
            height: 40px;
            border-radius: 10px;
            position: relative;
            overflow: hidden;
            background: #f0f0f0;
        }

        .result-fill {
            height: 100%;
            transition: width 0.5s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }

        .result-fill.yes {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
        }

        .result-fill.no {
            background: linear-gradient(135deg, #eb3349 0%, #f45c43 100%);
        }

        .total-count {
            text-align: center;
            font-size: 20px;
            color: #666;
            margin: 20px 0;
        }

        .btn-back {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            background: #6c757d;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn-back:hover {
            background: #5a6268;
        }

        /* 비밀번호 입력 모달 */
        .password-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .password-modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        .password-modal h3 {
            margin-bottom: 20px;
            color: #333;
        }

        .password-modal input {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .password-modal input:focus {
            outline: none;
            border-color: #667eea;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
        }

        .modal-buttons button {
            flex: 1;
            padding: 12px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-confirm {
            background: #667eea;
            color: white;
        }

        .btn-cancel {
            background: #ddd;
            color: #333;
        }

        .error-message {
            color: #eb3349;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 초기 설정 화면 -->
        <div class="setup-screen" id="setupScreen">
            <h1>급식 만족도 조사 설정</h1>
            <div class="input-group">
                <input type="text" id="menuNameInput" placeholder="오늘의 메뉴 이름 입력 (예: 김치찌개)">
            </div>
            <div class="input-group">
                <input type="password" id="passwordInput" placeholder="관리자 비밀번호 설정">
            </div>
            <button class="btn-start" onclick="startSurvey()">시작하기</button>
        </div>

        <!-- 투표 화면 -->
        <div class="vote-screen" id="voteScreen">
            <h2>오늘의 <span class="menu-name" id="menuNameDisplay"></span> 메뉴는<br>맛있었나요?</h2>
            <div class="vote-buttons">
                <button class="vote-btn yes" onclick="vote('yes')">예</button>
                <button class="vote-btn no" onclick="vote('no')">아니요</button>
            </div>
            <div class="thank-you" id="thankYou">투표해주셔서 감사합니다! 😊</div>
        </div>

        <!-- 결과 화면 -->
        <div class="results-screen" id="resultsScreen">
            <h2><span id="resultsMenuName"></span> 만족도 결과</h2>
            <div class="result-bars">
                <div class="result-item">
                    <div class="result-label yes">
                        <span>예 (맛있었어요)</span>
                        <span id="yesPercentage">0%</span>
                    </div>
                    <div class="result-bar">
                        <div class="result-fill yes" id="yesFill" style="width: 0%">
                            <span id="yesCount">0</span>
                        </div>
                    </div>
                </div>
                <div class="result-item">
                    <div class="result-label no">
                        <span>아니요 (별로였어요)</span>
                        <span id="noPercentage">0%</span>
                    </div>
                    <div class="result-bar">
                        <div class="result-fill no" id="noFill" style="width: 0%">
                            <span id="noCount">0</span>
                        </div>
                    </div>
                </div>
            </div>
            <div class="total-count">총 투표 수: <strong id="totalCount">0</strong>명</div>
            <button class="btn-back" onclick="backToVote()">투표 화면으로</button>
        </div>

        <!-- 결과보기 아이콘 -->
        <div class="results-icon" id="resultsIcon" onclick="showPasswordModal()" style="display: none;">
            <svg viewBox="0 0 24 24">
                <path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/>
            </svg>
        </div>
    </div>

    <!-- 비밀번호 모달 -->
    <div class="password-modal" id="passwordModal">
        <div class="password-modal-content">
            <h3>관리자 인증</h3>
            <input type="password" id="passwordCheck" placeholder="비밀번호 입력">
            <p class="error-message" id="errorMessage">비밀번호가 일치하지 않습니다.</p>
            <div class="modal-buttons">
                <button class="btn-confirm" onclick="checkPassword()">확인</button>
                <button class="btn-cancel" onclick="closePasswordModal()">취소</button>
            </div>
        </div>
    </div>

    <script>
        // 데이터 저장
        let menuName = '';
        let password = '';
        let yesVotes = 0;
        let noVotes = 0;

        // 초기 설정
        function startSurvey() {
            const menuInput = document.getElementById('menuNameInput').value.trim();
            const passInput = document.getElementById('passwordInput').value.trim();

            if (!menuInput || !passInput) {
                alert('메뉴 이름과 비밀번호를 모두 입력해주세요.');
                return;
            }

            menuName = menuInput;
            password = passInput;

            document.getElementById('setupScreen').style.display = 'none';
            document.getElementById('voteScreen').style.display = 'block';
            document.getElementById('resultsIcon').style.display = 'flex';
            document.getElementById('menuNameDisplay').textContent = menuName;
        }

        // 투표하기
        function vote(choice) {
            if (choice === 'yes') {
                yesVotes++;
            } else {
                noVotes++;
            }

            // 감사 메시지 표시
            const thankYou = document.getElementById('thankYou');
            thankYou.style.display = 'block';

            // 1.5초 후 메시지 숨기기
            setTimeout(() => {
                thankYou.style.display = 'none';
            }, 1500);
        }

        // 비밀번호 모달 표시
        function showPasswordModal() {
            document.getElementById('passwordModal').style.display = 'flex';
            document.getElementById('passwordCheck').value = '';
            document.getElementById('errorMessage').style.display = 'none';
            document.getElementById('passwordCheck').focus();
        }

        // 비밀번호 모달 닫기
        function closePasswordModal() {
            document.getElementById('passwordModal').style.display = 'none';
        }

        // 비밀번호 확인
        function checkPassword() {
            const inputPassword = document.getElementById('passwordCheck').value;
            if (inputPassword === password) {
                closePasswordModal();
                showResults();
            } else {
                document.getElementById('errorMessage').style.display = 'block';
            }
        }

        // Enter 키로 비밀번호 확인
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('passwordCheck').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    checkPassword();
                }
            });
        });

        // 결과 화면 표시
        function showResults() {
            const total = yesVotes + noVotes;
            const yesPercent = total > 0 ? Math.round((yesVotes / total) * 100) : 0;
            const noPercent = total > 0 ? Math.round((noVotes / total) * 100) : 0;

            document.getElementById('resultsMenuName').textContent = menuName;
            document.getElementById('yesCount').textContent = yesVotes;
            document.getElementById('noCount').textContent = noVotes;
            document.getElementById('totalCount').textContent = total;
            document.getElementById('yesPercentage').textContent = yesPercent + '%';
            document.getElementById('noPercentage').textContent = noPercent + '%';

            document.getElementById('yesFill').style.width = yesPercent + '%';
            document.getElementById('noFill').style.width = noPercent + '%';

            document.getElementById('voteScreen').style.display = 'none';
            document.getElementById('resultsScreen').style.display = 'block';
        }

        // 투표 화면으로 돌아가기
        function backToVote() {
            document.getElementById('resultsScreen').style.display = 'none';
            document.getElementById('voteScreen').style.display = 'block';
        }
    </script>
</body>
</html>
