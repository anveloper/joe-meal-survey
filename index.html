<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>급식 만족도 조사</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  </head>
  <body>
    <div class="container">
      <!-- 초기 설정 화면 -->
      <div class="setup-screen" id="setupScreen">
        <h1>급식 만족도 조사 설정</h1>
        <div class="input-group">
          <input type="text" id="menuNameInput" placeholder="오늘의 메뉴 이름 입력 (예: 김치찌개)" />
        </div>
        <div class="input-group">
          <input type="password" id="passwordInput" placeholder="관리자 비밀번호 설정" />
        </div>
        <div class="color-picker-group">
          <label>배경 색상 선택</label>
          <div class="color-options">
            <button
              class="color-btn active"
              data-gradient="linear-gradient(135deg, #a8edea 0%, #fed6e3 100%)"
              title="파스텔"
            ></button>
            <button
              class="color-btn"
              data-gradient="linear-gradient(135deg, #f093fb 0%, #f5576c 100%)"
              title="핑크"
            ></button>
            <button
              class="color-btn"
              data-gradient="linear-gradient(135deg, #4facfe 0%, #00f2fe 100%)"
              title="파랑"
            ></button>
            <button
              class="color-btn"
              data-gradient="linear-gradient(135deg, #43e97b 0%, #38f9d7 100%)"
              title="민트"
            ></button>
            <button
              class="color-btn"
              data-gradient="linear-gradient(135deg, #fa709a 0%, #fee140 100%)"
              title="핑크오렌지"
            ></button>
            <button
              class="color-btn"
              data-gradient="linear-gradient(135deg, #30cfd0 0%, #330867 100%)"
              title="청록"
            ></button>
            <button
              class="color-btn"
              data-gradient="linear-gradient(135deg, #667eea 0%, #764ba2 100%)"
              title="보라"
            ></button>
          </div>
        </div>
        <button class="btn-start" onclick="startSurvey()">시작하기</button>
      </div>

      <!-- 투표 화면 -->
      <div class="vote-screen" id="voteScreen">
        <h2>오늘의 <span class="menu-name" id="menuNameDisplay"></span> 메뉴는<br />맛있었나요?</h2>
        <div class="vote-buttons">
          <button class="vote-btn yes" onclick="vote('yes', event)">예</button>
          <button class="vote-btn no" onclick="vote('no', event)">아니요</button>
        </div>
      </div>

      <!-- 결과 화면 -->
      <div class="results-screen" id="resultsScreen">
        <h2><span id="resultsMenuName"></span> 만족도 결과</h2>
        <div class="result-bars">
          <div class="result-item">
            <div class="result-label yes">
              <span>예 (맛있었어요)</span>
              <span id="yesPercentage">0%</span>
            </div>
            <div class="result-bar">
              <div class="result-fill yes" id="yesFill" style="width: 0%">
                <span id="yesCount">0</span>
              </div>
            </div>
          </div>
          <div class="result-item">
            <div class="result-label no">
              <span>아니요 (별로였어요)</span>
              <span id="noPercentage">0%</span>
            </div>
            <div class="result-bar">
              <div class="result-fill no" id="noFill" style="width: 0%">
                <span id="noCount">0</span>
              </div>
            </div>
          </div>
        </div>
        <div class="total-count">총 투표 수: <strong id="totalCount">0</strong>명</div>
        <div class="result-buttons">
          <button class="btn-back" onclick="backToVote()">투표 화면으로</button>
          <button class="btn-reset" onclick="resetAllData()">초기화</button>
        </div>
      </div>

      <!-- 스크린샷 저장 버튼 -->
      <div class="screenshot-icon" id="screenshotIcon" onclick="saveScreenshot()" style="display: none">
        <svg viewBox="0 0 24 24">
          <path
            d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"
          />
        </svg>
      </div>

      <!-- 전체화면 버튼 -->
      <div class="fullscreen-icon" id="fullscreenIcon" onclick="toggleFullscreen()" style="display: none">
        <!-- 확장 아이콘 (전체화면 아닐 때) -->
        <svg id="expandIcon" viewBox="0 0 24 24">
          <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z" />
        </svg>
        <!-- 축소 아이콘 (전체화면일 때) -->
        <svg id="compressIcon" viewBox="0 0 24 24" style="display: none">
          <path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z" />
        </svg>
      </div>

      <!-- 결과보기 아이콘 -->
      <div class="results-icon" id="resultsIcon" onclick="showPasswordModal()" style="display: none">
        <svg viewBox="0 0 24 24">
          <path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z" />
        </svg>
      </div>
    </div>

    <!-- 감사 메시지 -->
    <!-- <div class="thank-you" id="thankYou">투표해주셔서 감사합니다!</div> -->

    <!-- 비밀번호 모달 -->
    <div class="password-modal" id="passwordModal">
      <div class="password-modal-content">
        <h3>관리자 인증</h3>
        <input type="password" id="passwordCheck" placeholder="비밀번호 입력" />
        <p class="error-message" id="errorMessage">비밀번호가 일치하지 않습니다.</p>
        <div class="modal-buttons">
          <button class="btn-confirm" onclick="checkPassword()">확인</button>
          <button class="btn-cancel" onclick="closePasswordModal()">취소</button>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
